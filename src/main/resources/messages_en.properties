about.arch.intro=The project follows the traditional <strong>MVC (Model-View-Controller)</strong> pattern in pure Java Web (separating interface, business logic, and data):
about.arch.diagram=Browser &larr;&rarr; JSP (Views) &larr;&rarr; Servlet (Controller) &larr;&rarr; Service (Rules) &larr;&rarr; DAO (Database) &larr;&rarr; MySQL (Data)
about.arch.details=The <code>MediaController</code> acts as a Front Controller, centralizing all incoming requests and routing them to the correct action. There is strong application of the <strong>DIP (Dependency Inversion Principle)</strong>, exemplified by the <code>MovieMetadataProvider</code> interface, allowing the system to depend on abstractions rather than concrete data provider classes. The <code>AppBootstrap.java</code> file (via <code>ServletContextListener</code>) serves as the Composition Root, instantiating and wiring DAOs and Services before Servlets handle any requests.

about.data.intro=Data storage (persistence) is based on a relational database. The main table <code>item_media</code> stores all records:
