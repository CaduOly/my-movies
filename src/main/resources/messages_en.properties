about.data.flyway=The database schema is managed by <strong>Flyway</strong>. Migrations (<code>V1</code> creates tables, <code>V2</code> seeds initial data) ensure instantaneous reproducibility.

about.tech.backend.title=Backend:
about.tech.backend.desc=Java 17, Jakarta Servlets, JSP, JSTL/EL.
about.tech.db.title=Database:
about.tech.db.desc=MySQL 8, JDBC (PreparedStatement), Flyway Migrations.
about.tech.tests.title=Testing:
about.tech.tests.desc=JUnit 5, Mockito, Testcontainers (for real database integration with ephemeral containers).
about.tech.build.title=Build & Infra:
about.tech.build.desc=Maven, Docker, Docker Compose, Tomcat 10.1.

about.run.intro=The primary runtime environment relies on <strong>Docker</strong> and <strong>Docker Compose</strong>.
about.run.start=<strong>Start application:</strong> Run <code>make start</code> in the terminal. Access <code>http://localhost:8080</code>.
about.run.stop=<strong>Stop application:</strong> Run <code>make down</code>.
about.run.test=<strong>Run tests:</strong> Run <code>make test</code> or <code>mvn clean test</code> (requires active Docker engine for Testcontainers).

about.sec.sqli.title=Database Intrusion (SQL Injection):
about.sec.sqli.desc=Risk completely eliminated in the DAO by exclusively using <code>PreparedStatement</code>. It separates SQL commands from user input (safe parameterization). The project includes automated tests using <code>Testcontainers</code> (which spawn a temporary database container during test execution) to verify this protection.
about.sec.xss.title=Cross-Site Scripting (XSS):
about.sec.xss.desc=Completely mitigated through the use of JSTL's <code>&lt;c:out value="..." /&gt;</code> tag, which converts special characters like &lt; and &gt; to plain text, and secure DOM node creation in the TMDB autocomplete (preventing arbitrary script execution in the browser).
about.sec.csrf.title=Cross-Site Request Forgery (CSRF):
about.sec.csrf.desc=As there is no authenticated session control or password-restricted areas, the impact of CSRF attacks is considered negligible in this scenario. For this reason, CSRF token mechanisms were not integrated into the project's academic scope.

about.tmdb.title=About TMDB and .env
about.tmdb.desc=The project uses a <code>.env</code> file with a read-only TMDB API key intentionally committed to the repository, aiming to facilitate evaluation without requiring extra registration. This key only has public read permissions.
about.tmdb.disclaimer="This product uses the TMDB API but is not endorsed or certified by TMDB."


