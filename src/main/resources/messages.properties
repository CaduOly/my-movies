about.tech.backend.desc=Java 17, Jakarta Servlets, JSP, JSTL/EL.
about.tech.db.title=Banco de Dados:
about.tech.db.desc=MySQL 8, JDBC (PreparedStatement), Flyway Migrations.
about.tech.tests.title=Testes:
about.tech.tests.desc=JUnit 5, Mockito, Testcontainers (para integração com BD real em containers efêmeros).
about.tech.build.title=Build e Infra:
about.tech.build.desc=Maven, Docker, Docker Compose, Tomcat 10.1.

about.run.intro=O ambiente de execução principal depende do <strong>Docker</strong> e <strong>Docker Compose</strong>.
about.run.start=<strong>Subir a aplicação:</strong> Execute <code>make start</code> no terminal. Acesse <code>http://localhost:8080</code>.
about.run.stop=<strong>Parar a aplicação:</strong> Execute <code>make down</code>.
about.run.test=<strong>Rodar os testes:</strong> Execute <code>make test</code> ou <code>mvn clean test</code> (necessário Docker ativo na máquina para o Testcontainers).

about.sec.sqli.title=Invasão de Banco de Dados (SQL Injection):
about.sec.sqli.desc=Risco completamente evitado no DAO ao utilizarmos exclusivamente <code>PreparedStatement</code>. Ele separa o comando SQL dos dados digitados pelo usuário (parametrização segura). O projeto possui testes automáticos utilizando <code>Testcontainers</code> (que criam um banco temporário no Docker durante a execução dos testes) para comprovar essa proteção.
about.sec.xss.title=Injeção de Código nas Telas (XSS):
about.sec.xss.desc=Completamente mitigado através do uso da tag <code>&lt;c:out value="..." /&gt;</code> da biblioteca JSTL, que transforma caracteres especiais como &lt; e &gt; em texto comum, e da criação segura de nós DOM no autocomplete do TMDB (evitando a execução de scripts arbitrários no navegador).
about.sec.csrf.title=Falsificação de Requisição entre Sites (CSRF):
about.sec.csrf.desc=Por não possuir controle de sessão autenticada ou áreas restritas por senha, o impacto de ataques CSRF é considerado negligenciável neste cenário. Por esse motivo, mecanismos de token CSRF não foram integrados no escopo acadêmico do projeto.

about.tmdb.title=Sobre o TMDB e .env
about.tmdb.desc=O projeto utiliza um arquivo <code>.env</code> com uma chave de API read-only do TMDB comitada no repositório propositalmente, visando facilitar a avaliação sem necessidade de cadastros adicionais. Esta chave só tem permissão de leitura pública.
about.tmdb.disclaimer="Este produto usa a API do TMDB, mas não é endossado nem certificado pelo TMDB."


