about.arch.intro=O projeto segue o padrão <strong>MVC (Model-View-Controller)</strong> tradicional em Java Web puro (modelo que separa a interface, a regra de negócio e os dados):
about.arch.diagram=Navegador &larr;&rarr; JSP (Telas) &larr;&rarr; Servlet (Controlador) &larr;&rarr; Service (Regras) &larr;&rarr; DAO (Banco) &larr;&rarr; MySQL (Dados)
about.arch.details=O <code>MediaController</code> atua como Front Controller (controlador principal), centralizando o recebimento de todas as requisições do sistema e direcionando-as para a ação correta. Há forte aplicação do <strong>DIP (Princípio de Inversão de Dependência)</strong>, exemplificado na interface <code>MovieMetadataProvider</code>, que permite que o sistema use interfaces em vez de depender diretamente de classes concretas de provedores de dados. O arquivo <code>AppBootstrap.java</code> (via <code>ServletContextListener</code>) funciona como o ponto centralizador (Composition Root), criando e interligando os DAOs e Services antes que os Servlets comecem a receber requisições.

about.data.intro=O armazenamento dos dados (persistência) é baseado em um banco de dados relacional. Existe a tabela principal <code>item_media</code> para guardar todos os registros:
